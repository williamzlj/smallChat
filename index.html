<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- interactive-widget=resizes-content：Android Chrome 键盘弹出时收缩布局视口，
         避免固定定位/85vh 的弹窗按"整屏高度"排版而被键盘盖住（iOS 会忽略该参数） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#22c55e" />
    <meta name="description" content="多设备信息同步工具" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png" />
    <link rel="mask-icon" href="/icon.svg" color="#22c55e" />
    <link rel="manifest" href="/manifest.json" />
    <title>smallChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
